
name: Build Aseprite for Windows

on:
  workflow_dispatch:
    inputs:
      aseprite_version:
        description: 'Aseprite git branch/tag (leave blank for beta, compatible with Skia m151)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Clone Aseprite with all submodules
        id: source
        shell: pwsh
        env:
          ASEPRITE_REF: ${{ inputs.aseprite_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.longpaths true

          $ref = if ([string]::IsNullOrWhiteSpace($env:ASEPRITE_REF)) {
            'beta'
          } else {
            $env:ASEPRITE_REF.Trim()
          }

          Write-Host "Cloning Aseprite ref: $ref"
          git clone --recurse-submodules --branch $ref https://github.com/aseprite/aseprite.git aseprite
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone Aseprite and submodules.' }

          $commit = (git -C aseprite rev-parse --short HEAD).Trim()
          "ref=$ref" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

          $tagFile = 'aseprite/laf/misc/skia-tag.txt'
          if (-not (Test-Path $tagFile)) { throw "Missing $tagFile. Verify submodules." }
          $requiredSkiaTag = (Get-Content $tagFile -Raw).Trim()
          Write-Host "LAF requires Skia: $requiredSkiaTag"
          if ($requiredSkiaTag -ne 'm151-a90155cff0') {
            throw "This Aseprite ref expects Skia $requiredSkiaTag, not m151-a90155cff0. Use a beta ref that supports m151."
          }

      - name: Install Ninja
        uses: aseprite/get-ninja@main

      - name: Initialize MSVC x64
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Download and extract Skia m151
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/aseprite/skia/releases/download/m151-a90155cff0/Skia-Windows-Release-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'skia-m151.zip'
          $dest = Join-Path $env:GITHUB_WORKSPACE 'skia'

          Write-Host "Downloading $url"
          curl.exe --fail --location --retry 5 --retry-all-errors --retry-delay 5 --ssl-revoke-best-effort --output "$archive" "$url"
          if ($LASTEXITCODE -ne 0) { throw 'Skia download failed.' }
          if ((Get-Item $archive).Length -lt 1048576) { throw 'Downloaded Skia archive is unexpectedly small.' }

          Expand-Archive -LiteralPath $archive -DestinationPath $dest -Force
          $lib = Join-Path $dest 'out/Release-x64/skia.lib'
          if (-not (Test-Path $lib)) { throw "Skia library not found: $lib. Check archive layout." }
          Write-Host "Skia ready: $lib"

      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $skia = Join-Path $env:GITHUB_WORKSPACE 'skia'
          $skiaLibDir = Join-Path $skia 'out/Release-x64'
          $skiaLib = Join-Path $skiaLibDir 'skia.lib'

          cmake -S aseprite -B aseprite/build -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DLAF_BACKEND=skia `
            "-DSKIA_DIR=$skia" `
            "-DSKIA_LIBRARY_DIR=$skiaLibDir" `
            "-DSKIA_LIBRARY=$skiaLib" `
            -DENABLE_SCRIPTING=OFF `
            -DENABLE_UPDATER=OFF `
            -DENABLE_TESTS=OFF `
            -DENABLE_CCACHE=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }

      - name: Compile Aseprite
        shell: pwsh
        run: |
          cmake --build aseprite/build --target aseprite --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }

      - name: Prepare portable Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = Join-Path $env:GITHUB_WORKSPACE 'aseprite/build/bin'
          $exe = Join-Path $bin 'aseprite.exe'
          if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }

          New-Item -ItemType File -Path (Join-Path $bin 'aseprite.ini') -Force | Out-Null

          $icuTarget = Join-Path $bin 'icudtl.dat'
          if (-not (Test-Path $icuTarget)) {
            $icuSource = Join-Path $env:GITHUB_WORKSPACE 'skia/third_party/externals/icu/flutter/icudtl.dat'
            if (Test-Path $icuSource) {
              Copy-Item -LiteralPath $icuSource -Destination $icuTarget
            } else {
              throw 'icudtl.dat missing in build/bin and Skia archive.'
            }
          }

          Get-ChildItem $bin | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload portable artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-${{ steps.source.outputs.commit }}
          path: aseprite/build/bin/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
  
